<!DOCTYPE html>

    <title>Surface Triangle</title>
</head>
<body>

<script>
    const getSurface = function (base, hauteur) {
    return (base * hauteur) / 2;
};

let b = Number(prompt("Entrez la base :"));
let h = Number(prompt("Entrez la hauteur :"));

alert("La surface est de : " + getSurface(b, h));
</script>
